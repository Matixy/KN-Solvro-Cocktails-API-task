version: '3.8'

services:
  # PostgreSQL 18
  postgres:
    image: postgres:18
    container_name: cocktail_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cocktail_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: